# Build the Syslogine documentation site against the theme in this repository.
# This is the fork's own smoke test: it fails if the theme and the site config
# drift apart.

name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # enableGitInfo needs the checkout to be trusted.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci --no-audit --no-fund
      - run: npm run docs-install
      - run: npm run build:production
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: userguide/public
          retention-days: 7
